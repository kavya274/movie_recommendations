<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" role="img" aria-label="Annihilation poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#3a2846"/>
      <stop offset="52%" stop-color="#1b1422"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#9160ad" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9160ad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbFill" cx="0.36" cy="0.3">
      <stop offset="0%" stop-color="#b290c6" stop-opacity="0.95"/>
      <stop offset="62%" stop-color="#523762" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0.98"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b0d6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#9160ad" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050507" stop-opacity="0"/>
      <stop offset="58%" stop-color="#050507" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="sideScrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050507" stop-opacity="0.88"/>
      <stop offset="60%" stop-color="#050507" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="55%" stop-color="#050507" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0.72"/>
    </radialGradient>
    <filter id="grain-annihilation" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="500" height="750" fill="url(#bg)"/>
  <ellipse cx="250" cy="270" rx="360" ry="315" fill="url(#glow)"/>
  <g>
    <circle cx="250" cy="300" r="46.0" fill="none" stroke="#c3a8d2" stroke-opacity="0.420" stroke-width="1.6"/>
    <circle cx="250" cy="300" r="73.0" fill="none" stroke="#c3a8d2" stroke-opacity="0.365" stroke-width="1.4200000000000002"/>
    <circle cx="250" cy="300" r="100.0" fill="none" stroke="#c3a8d2" stroke-opacity="0.310" stroke-width="1.2400000000000002"/>
    <circle cx="250" cy="300" r="127.0" fill="none" stroke="#c3a8d2" stroke-opacity="0.255" stroke-width="1.06"/>
    <circle cx="250" cy="300" r="154.0" fill="none" stroke="#c3a8d2" stroke-opacity="0.200" stroke-width="0.8800000000000001"/>
    <circle cx="250" cy="300" r="181.0" fill="none" stroke="#c3a8d2" stroke-opacity="0.145" stroke-width="0.7000000000000002"/>
    <circle cx="250" cy="300" r="26" fill="#c3a8d2" fill-opacity="0.14"/>
  </g>
  <rect width="500" height="750" fill="url(#vig)"/>
  <rect y="345" width="500" height="405" fill="url(#scrim)"/>
  <rect width="500" height="750" filter="url(#grain-annihilation)" opacity="0.055"/>
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="52" y="618" width="34" height="2" fill="#ceb7da" fill-opacity="0.85"/>
    <text x="52" y="658" font-size="52" font-weight="700" letter-spacing="-1" fill="#f5f5f7">ANNIHILATION</text>
    <text x="52" y="702" font-size="17" font-weight="500" letter-spacing="4" fill="#f5f5f7" fill-opacity="0.62">2018</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" role="img" aria-label="Gravity poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#1b3046"/>
      <stop offset="52%" stop-color="#0e1722"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#3f76ad" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3f76ad" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbFill" cx="0.36" cy="0.3">
      <stop offset="0%" stop-color="#799fc6" stop-opacity="0.95"/>
      <stop offset="62%" stop-color="#254362" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0.98"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fbbd6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#3f76ad" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050507" stop-opacity="0"/>
      <stop offset="58%" stop-color="#050507" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="sideScrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050507" stop-opacity="0.88"/>
      <stop offset="60%" stop-color="#050507" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="55%" stop-color="#050507" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0.72"/>
    </radialGradient>
    <filter id="grain-gravity" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="500" height="750" fill="url(#bg)"/>
  <ellipse cx="250" cy="270" rx="360" ry="315" fill="url(#glow)"/>
  <g>
    <circle cx="250" cy="300" r="150" fill="url(#orbFill)"/>
    <circle cx="250" cy="300" r="150" fill="none" stroke="#95b4d2" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="250" cy="300" r="192" fill="none" stroke="#95b4d2" stroke-opacity="0.13" stroke-width="0.9"/>
    <ellipse cx="250" cy="300" rx="243.00000000000003" ry="30" fill="none" stroke="#95b4d2" stroke-opacity="0.22" stroke-width="0.9" transform="rotate(-14 250 300)"/>
  </g>
  <rect width="500" height="750" fill="url(#vig)"/>
  <rect y="345" width="500" height="405" fill="url(#scrim)"/>
  <rect width="500" height="750" filter="url(#grain-gravity)" opacity="0.055"/>
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="52" y="618" width="34" height="2" fill="#a9c1da" fill-opacity="0.85"/>
    <text x="52" y="658" font-size="52" font-weight="700" letter-spacing="-1" fill="#f5f5f7">GRAVITY</text>
    <text x="52" y="702" font-size="17" font-weight="500" letter-spacing="4" fill="#f5f5f7" fill-opacity="0.62">2013</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750" role="img" aria-label="Memento poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#383532"/>
      <stop offset="52%" stop-color="#1a1919"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#8a8479" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8a8479" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbFill" cx="0.36" cy="0.3">
      <stop offset="0%" stop-color="#ada9a1" stop-opacity="0.95"/>
      <stop offset="62%" stop-color="#4e4b46" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0.98"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5c2bc" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#8a8479" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050507" stop-opacity="0"/>
      <stop offset="58%" stop-color="#050507" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="sideScrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050507" stop-opacity="0.88"/>
      <stop offset="60%" stop-color="#050507" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="55%" stop-color="#050507" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050507" stop-opacity="0.72"/>
    </radialGradient>
    <filter id="grain-memento" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="500" height="750" fill="url(#bg)"/>
  <ellipse cx="250" cy="270" rx="360" ry="315" fill="url(#glow)"/>
  <g>
    <circle cx="250" cy="300" r="104" fill="#bfbbb5" fill-opacity="0.2"/>
    <rect x="-10" y="110.0" width="520" height="11" fill="#bfbbb5" fill-opacity="0.080"/>
    <rect x="-10" y="156.0" width="520" height="17" fill="#bfbbb5" fill-opacity="0.130"/>
    <rect x="-10" y="202.0" width="520" height="23" fill="#bfbbb5" fill-opacity="0.180"/>
    <rect x="-10" y="248.0" width="520" height="11" fill="#bfbbb5" fill-opacity="0.230"/>
    <rect x="-10" y="294.0" width="520" height="17" fill="#bfbbb5" fill-opacity="0.080"/>
    <rect x="-10" y="340.0" width="520" height="23" fill="#bfbbb5" fill-opacity="0.130"/>
    <rect x="-10" y="386.0" width="520" height="11" fill="#bfbbb5" fill-opacity="0.180"/>
    <rect x="-10" y="432.0" width="520" height="17" fill="#bfbbb5" fill-opacity="0.230"/>
    <rect x="-10" y="478.0" width="520" height="23" fill="#bfbbb5" fill-opacity="0.080"/>
  </g>
  <rect width="500" height="750" fill="url(#vig)"/>
  <rect y="345" width="500" height="405" fill="url(#scrim)"/>
  <rect width="500" height="750" filter="url(#grain-memento)" opacity="0.055"/>
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="52" y="618" width="34" height="2" fill="#cac8c3" fill-opacity="0.85"/>
    <text x="52" y="658" font-size="52" font-weight="700" letter-spacing="-1" fill="#f5f5f7">MEMENTO</text>
    <text x="52" y="702" font-size="17" font-weight="500" letter-spacing="4" fill="#f5f5f7" fill-opacity="0.62">2000</text>
  </g>
</svg>

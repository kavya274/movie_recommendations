      <stop offset="100%" stop-color="#050507" stop-opacity="0.98"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8b0d6" stop-opacity="0.42"/>
